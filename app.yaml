# Google App Engine Flexible / Custom Runtime Configuration
runtime: custom
env: flex

resources:
  cpu: 2
  memory_gb: 2.5
  disk_size_gb: 15

automatic_scaling:
  min_num_instances: 1
  max_num_instances: 3
  cool_down_period_sec: 120
  cpu_utilization:
    target_utilization: 0.7

env_variables:
  PORT: "8080"
