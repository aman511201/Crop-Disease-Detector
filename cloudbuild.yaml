# Google Cloud Build configuration for AgroScan AI
# Automatically builds container image and deploys to Google Cloud Run
steps:
  # 1. Build the container image using Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/crop-disease-detector:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/crop-disease-detector:latest', '.']

  # 2. Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/crop-disease-detector:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run (Serverless)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'crop-disease-detector'
      - '--image'
      - 'gcr.io/$PROJECT_ID/crop-disease-detector:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/crop-disease-detector:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/crop-disease-detector:latest'
